[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sba"
version = "0.1.0"
description = "Second Brain Agent — персональный локальный AI-ассистент"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "tzdata>=2024.1",  # база часовых поясов IANA: в Windows нет системной
    "httpx>=0.27",
    "aiogram>=3.10",
    "send2trash>=1.8",  # удаление в корзину ОС, а не мимо неё
    "qdrant-client>=1.9",  # векторное хранилище, embedded-режим (ADR-3)
    "pypdf>=4.2",  # извлечение текста из PDF (чистый Python; OCR — Sprint 8)
    "python-docx>=1.1",  # извлечение текста из DOCX
    "openpyxl>=3.1",  # извлечение значений из XLSX/XLSM (чистый Python, потоковое чтение)
    "python-dateutil>=2.9",  # RRULE: валидация и вычисление следующего срабатывания
    "anthropic>=0.40",  # облачный провайдер Claude (роль chat под аккаунтом владельца)
    "fastapi>=0.111",   # локальный web-чат (Sprint 9)
    "uvicorn>=0.30",    # ASGI-сервер web-чата
    "websockets>=12",   # WebSocket-транспорт uvicorn
    "mcp>=1.2",         # Model Context Protocol: клиент-хаб и наш сервер (ADR-7)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
sba = "sba.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sba"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# RUF001-003: «неоднозначный юникод» — проект намеренно русскоязычный
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sba"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "send2trash.*"
ignore_missing_imports = true

# openpyxl не поставляет типовых аннотаций (py.typed) — трактуем как
# нетипизированный модуль (как send2trash выше)
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# SDK Anthropic: события стрима — сложные union-типы; в strict-режиме доступ к их
# полям тонет в проверках. Провайдер обращается к ним по документированной форме,
# поэтому трактуем модуль как нетипизированный (как send2trash выше)
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true
follow_imports = "skip"

# SDK MCP: декораторы low-level сервера нетипизированы, дженерики сложные —
# трактуем как нетипизированный модуль (обращения — по документированной форме)
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
follow_imports = "skip"

# ── Границы модулей (архитектура: docs/03-project-structure.md) ──────────────
[tool.importlinter]
root_package = "sba"

[[tool.importlinter.contracts]]
name = "Ядро не знает о каналах и модулях"
type = "forbidden"
source_modules = ["sba.core"]
forbidden_modules = ["sba.channels", "sba.modules", "sba.mcp"]

[[tool.importlinter.contracts]]
name = "Модули не знают о каналах"
type = "forbidden"
source_modules = ["sba.modules"]
forbidden_modules = ["sba.channels", "sba.mcp"]

[[tool.importlinter.contracts]]
name = "Каналы не трогают LLM напрямую"
type = "forbidden"
source_modules = ["sba.channels"]
forbidden_modules = ["sba.llm", "sba.mcp"]

[[tool.importlinter.contracts]]
name = "Инфраструктура не содержит предметной логики"
type = "forbidden"
source_modules = ["sba.infra"]
forbidden_modules = ["sba.core", "sba.channels", "sba.llm"]
