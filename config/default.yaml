# Полный конфиг с дефолтами (в git). Переопределения — в config/local.yaml
# (не в git) либо переменными окружения: SBA__SECTION__KEY, напр. SBA__LOGGING__LEVEL=DEBUG.

app:
  data_dir: ./data
  timezone: Europe/Moscow

logging:
  level: INFO
  format: console        # console | json
  file: ""               # путь к файлу журнала (плюс к консоли) — удобно для отладки:
                         # при ошибке пришлёте файл целиком. Пусто = только консоль.
                         # Пример в local.yaml: file: 'data/logs/sba.log'

session:
  idle_timeout_minutes: 60

agent:
  processor: llm             # llm | echo (echo — диагностика транспорта без модели)
  history_max_messages: 16   # сколько последних сообщений сессии видит модель
  history_budget_chars: 4000 # ~1000 токенов: жёсткий бюджет истории (CPU-only, см. docs/01 §4.2)
  max_tool_iterations: 5     # предохранитель agent loop
  topic_scoped_tools: false  # true — слать модели только инструменты по теме
                             # сообщения (короче промпт → быстрее ответ на CPU);
                             # на слабой машине рекомендуется включить

llm:
  keep_warm_minutes: 4       # пинг модели раз в N минут: не даёт Ollama выгрузить её
                             # из RAM (иначе первый ответ после простоя ждёт минуты);
                             # 0 — отключить прогрев

modules:
  memory:
    enabled: true            # долговременная память: запомни / вспомни / забудь
    semantic: true           # true — поиск по памяти по смыслу (держит bge-m3 в RAM);
                             # false — по словам (FTS), экономит ~1.2 ГБ памяти на CPU-машине
    auto_extract: true       # автопамять: закрытые разговоры фоново сворачиваются в
                             # эпизоды, важные факты запоминаются сами (ревизия: /memory)
    min_confidence: 0.7      # извлечённые факты с уверенностью ниже — отбрасываются
    max_facts_per_session: 5 # не больше автозаписей с одного разговора (защита от мусора)
    check_interval_seconds: 600  # период поиска неконсолидированных разговоров
    dialog_cooldown_seconds: 90  # тишина в диалоге перед фоновыми LLM-вызовами
    llm_timeout_seconds: 180     # таймаут одного LLM-шага консолидации (CPU медленный)
  rag:
    enabled: true            # поиск по документам («найди в моих документах…»)
    # Папки с документами для индексации — задать в local.yaml. Windows-пути
    # В ОДИНАРНЫХ кавычках: sources: ['C:\Users\mmirosh\Documents']
    sources: []
    include_extensions: [".pdf", ".docx", ".md", ".txt"]
    max_file_mb: 50            # файлы крупнее пропускаются (с записью в лог)
    scan_interval_minutes: 2   # период поиска новых/изменённых файлов
    dialog_cooldown_seconds: 90  # пауза индексации после сообщения в диалоге
    chunk_chars: 1800          # размер фрагмента (~450 токенов)
    chunk_overlap_chars: 200
    search_top_k: 5            # сколько фрагментов возвращает search_documents
    snippet_chars: 700         # длина цитаты в результате поиска
    embed_batch: 8             # чанков за один запрос эмбеддинга (CPU-only)
  tasks:
    enabled: true              # задачи: «создай задачу…», «что у меня по проекту…»
    list_limit: 15             # сколько задач показывают /tasks и search_tasks
    default_hour: 9            # час срока, если назван день, но не время («завтра» → 09:00)
    clarify_confidence: 0.6    # ниже этой уверенности парсер даты переспрашивает
  scheduler:
    tick_seconds: 15           # период проверки созревших срабатываний
    misfire_grace_minutes: 240 # опоздавшая сводка доставляется не позже этого срока
  reminders:
    enabled: true              # напоминания: сами приходят в срок, переживают рестарт
    snooze_minutes: 180        # кнопка «⏰ Позже» без слов = перенос на 3 часа
    followup_hours: 24         # «напоминай, пока не сделаю» — период повторов
    morning_brief:
      enabled: true            # утренняя сводка: задачи и напоминания на день
      time: "08:30"

files:
  # Папки, внутри которых работают файловые инструменты. Пусто = инструменты
  # отвечают подсказкой. Windows-пути — В ОДИНАРНЫХ кавычках (иначе \U — escape):
  #   allowed_roots: ['C:\Users\mmirosh\Downloads', 'C:\Users\mmirosh\Documents']
  allowed_roots: []
  max_list_entries: 50
  max_read_chars: 4000

channels:
  cli:
    enabled: true
  telegram:
    enabled: false           # включить в local.yaml, там же token и allowed_user_ids
    token: ""                # токен от @BotFather — ТОЛЬКО в local.yaml, не в git
    allowed_user_ids: []     # ваш числовой Telegram id; чужие сообщения игнорируются
