# Роли моделей → рантаймы (LLM Gateway).
# Обоснование выбора моделей: docs/01-requirements.md §4.1–4.2 (CPU-only железо).
# Время жизни модели в RAM задаётся переменной окружения Ollama: OLLAMA_KEEP_ALIVE=60m.

runtimes:
  ollama:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ""              # Ollama не требует ключа

  # Облачный Claude (роль chat под аккаунтом владельца). Включается вручную:
  # раскомментируйте рантайм ниже и переназначьте на него роль chat.
  # Авторизация — вход `ant auth login` (профиль на диске, SDK берёт его сам);
  # api_key оставить пустым (файл в git — секреты сюда не писать). У Anthropic
  # нет эмбеддингов, поэтому роль embedding обязана остаться на ollama.
  # anthropic:
  #   kind: anthropic
  #   api_key: ""            # пусто = учётка из окружения / `ant auth login`

  # DeepSeek — дешёвый OpenAI-совместимый облачный провайдер (работает нашим же
  # openai_compatible-провайдером). Ключ берётся из переменной окружения
  # DEEPSEEK_API_KEY (в git-файл его писать нельзя). У DeepSeek нет эмбеддингов —
  # роль embedding оставьте на ollama.
  # deepseek:
  #   kind: openai_compatible
  #   base_url: https://api.deepseek.com
  #   api_key: "${DEEPSEEK_API_KEY}"

roles:
  # temperature 0.3: у qwen2.5 7B выше температура = чаще вставки на других
  # языках и, главное, выдуманные списки файлов вместо вызова инструмента.
  chat:       { runtime: ollama, model: "qwen2.5:7b-instruct", temperature: 0.3 }
  # Облачная модель вместо локальной (раскомментируйте нужный рантайм выше и
  # оставьте ОДНУ строку chat):
  # chat:     { runtime: anthropic, model: "claude-sonnet-5", max_tokens: 4096 }
  # chat:     { runtime: deepseek,  model: "deepseek-chat", temperature: 0.3 }
  extraction: { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0 }
  summarize:  { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.3 }
  # мультиязычные эмбеддинги (ру/en) для RAG и памяти; поставить: ollama pull bge-m3
  embedding:  { runtime: ollama, model: "bge-m3" }
