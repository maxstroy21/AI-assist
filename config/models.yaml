# Роли моделей → рантаймы. Используется с Sprint 1 (LLM Gateway).
# Обоснование выбора моделей: docs/01-requirements.md §4.1–4.2 (CPU-only железо).

runtimes:
  ollama:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ollama          # заглушка, Ollama не проверяет

roles:
  chat:       { runtime: ollama, model: "qwen2.5:7b-instruct", temperature: 0.7, keep_alive: 60m }
  extraction: { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0 }
  summarize:  { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.3 }
