# Роли моделей → рантаймы (LLM Gateway).
# Обоснование выбора моделей: docs/01-requirements.md §4.1–4.2 (CPU-only железо).
# Время жизни модели в RAM задаётся переменной окружения Ollama: OLLAMA_KEEP_ALIVE=60m.

runtimes:
  ollama:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
    api_key: ""              # Ollama не требует ключа

  # Groq — быстрый облачный провайдер с бесплатным лимитом (выбор владельца,
  # 2026-07-24). Ключ живёт в переменной окружения Windows GROQ_API_KEY
  # (setx GROQ_API_KEY "gsk_..."), в этот файл его писать НЕЛЬЗЯ — файл в git.
  # Без переменной ассистент не стартует и честно скажет, что задать.
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    api_key: "${GROQ_API_KEY}"

  # Облачный Claude (роль chat под аккаунтом владельца). Включается вручную:
  # раскомментируйте рантайм ниже и переназначьте на него роль chat.
  # Авторизация — вход `ant auth login` (профиль на диске, SDK берёт его сам);
  # api_key оставить пустым (файл в git — секреты сюда не писать). У Anthropic
  # нет эмбеддингов, поэтому роль embedding обязана остаться на ollama.
  # anthropic:
  #   kind: anthropic
  #   api_key: ""            # пусто = учётка из окружения / `ant auth login`

  # DeepSeek — дешёвый OpenAI-совместимый облачный провайдер (работает нашим же
  # openai_compatible-провайдером). Ключ берётся из переменной окружения
  # DEEPSEEK_API_KEY (в git-файл его писать нельзя). У DeepSeek нет эмбеддингов —
  # роль embedding оставьте на ollama.
  # deepseek:
  #   kind: openai_compatible
  #   base_url: https://api.deepseek.com
  #   api_key: "${DEEPSEEK_API_KEY}"

roles:
  # Роль chat — облачный Groq (2026-07-24): qwen3.6-27b. Выбран за дневной
  # минутный лимит 12K токенов — этого хватает на чтение документов (у
  # qwen3-27b было всего 8K/мин, и чтение Excel не влезало → 429, 2026-07-25).
  # Плата — дневной запас 100K (у qwen3 было 200K); счётчик обнуляется в
  # полночь UTC (03:00 МСК). temperature 0.3 — как и раньше.
  chat:       { runtime: groq, model: "llama-3.3-70b-versatile", temperature: 0.3 }
  # Больше дневной запас (200K), но минутный лимит опять 8K (те же 429 на
  # тяжёлых запросах): qwen/qwen3.6-27b или openai/gpt-oss-120b.
  # Без лимитов вовсе (70K/мин, дневной безлимит): groq/compound — но это
  # «агентная» система Groq, поведение с нашими инструментами не проверено.
  # Вернуться на локальную модель (нет интернета): закомментируйте строку chat
  # выше и раскомментируйте эту:
  # chat:     { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.3 }
  # Ещё облачные варианты (раскомментируйте нужный рантайм выше, оставьте ОДНУ chat):
  # chat:     { runtime: anthropic, model: "claude-sonnet-5", max_tokens: 4096 }
  # chat:     { runtime: deepseek,  model: "deepseek-chat", temperature: 0.3 }
  extraction: { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0 }
  summarize:  { runtime: ollama, model: "qwen2.5:3b-instruct", temperature: 0.3 }
  # мультиязычные эмбеддинги (ру/en) для RAG и памяти; поставить: ollama pull bge-m3
  embedding:  { runtime: ollama, model: "bge-m3" }
